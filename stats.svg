<svg width="840" height="508" viewBox="0 0 840 508" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Статистика GitHub: Pivozavr7">
  <style>
    :root{--bg:#F3EDF7;--panel:#E7E0EC;--text:#1D1B20;--sub:#49454F;--chip:#EADDFF;--chipt:#21005D;
      --a:#EADDFF;--ao:#21005D;--b:#FFD8E4;--bo:#31111D;--c:#B7F397;--co:#0C2000;--d:#D3E3FD;--do:#001C3B;--e:#FFE08C;--eo:#261A00}
    @media (prefers-color-scheme:dark){:root{--bg:#211F26;--panel:#2B2930;--text:#E6E0E9;--sub:#CAC4D0;--chip:#4F378B;--chipt:#EADDFF;
      --a:#4F378B;--ao:#EADDFF;--b:#633B48;--bo:#FFD8E4;--c:#2D5016;--co:#B7F397;--d:#284777;--do:#D3E3FD;--e:#5B4300;--eo:#FFE08C}}
    .bg{fill:var(--bg)}
    .h{font:600 28px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif;fill:var(--text)}
    .sub{font:500 15px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif;fill:var(--sub)}
    .chip{fill:var(--chip)}
    .chipt{font:600 15px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif;fill:var(--chipt)}
    .n{font:600 40px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif;text-anchor:middle}
    .l{font:500 14px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif;text-anchor:middle}
    .lg{font:500 15px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif;fill:var(--text)}
    .ct{font:600 15px Roboto,'Google Sans','Segoe UI',Ubuntu,sans-serif}
    .tile{opacity:0;animation:up .5s cubic-bezier(.2,0,0,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  </style>
  <rect class="bg" width="840" height="508" rx="28"/>
  <text x="28" y="52" class="h">Pivozavr7</text>
  <text x="28" y="76" class="sub">Пишу на Rust и Zig. Сам, (НЕ)руками. это тоже кстати</text>

  <g class="tile" style="animation-delay:.05s"><rect x="24" y="96" width="148" height="112" rx="20" fill="var(--a)"/>
    <text x="98" y="150" class="n" fill="var(--ao)">4</text><text x="98" y="180" class="l" fill="var(--ao)">Репозитории</text></g>
  <g class="tile" style="animation-delay:.15s"><rect x="184" y="96" width="148" height="112" rx="20" fill="var(--b)"/>
    <text x="258" y="150" class="n" fill="var(--bo)">0</text><text x="258" y="180" class="l" fill="var(--bo)">Звёзды</text></g>
  <g class="tile" style="animation-delay:.25s"><rect x="344" y="96" width="148" height="112" rx="20" fill="var(--c)"/>
    <text x="418" y="150" class="n" fill="var(--co)">111</text><text x="418" y="180" class="l" fill="var(--co)">Коммиты</text></g>
  <g class="tile" style="animation-delay:.35s"><rect x="504" y="96" width="148" height="112" rx="20" fill="var(--d)"/>
    <text x="578" y="150" class="n" fill="var(--do)">1</text><text x="578" y="180" class="l" fill="var(--do)">Pull request’ы</text></g>
  <g class="tile" style="animation-delay:.45s"><rect x="664" y="96" width="148" height="112" rx="20" fill="var(--e)"/>
    <text x="738" y="150" class="n" fill="var(--eo)">0</text><text x="738" y="180" class="l" fill="var(--eo)">Issues</text></g>

  <g class="tile" style="animation-delay:.6s"><rect class="chip" x="24" y="224" width="788" height="44" rx="22"/>
    <text x="52" y="252" class="chipt">Дней без вайбкода</text>
    <text x="784" y="252" class="chipt" text-anchor="end">0 · всегда</text></g>

  <g class="tile" style="animation-delay:.75s">
    <rect x="24" y="284" width="788" height="200" rx="24" fill="var(--panel)"/>
    <circle cx="150" cy="384" r="60" fill="none" stroke="var(--bg)" stroke-width="26"/>
    <circle cx="150" cy="384" r="60" fill="none" stroke="#7F67BE" stroke-width="26" stroke-dasharray="127.02 249.97" stroke-dashoffset="-0.00" transform="rotate(-90 150 384)"/>
<circle cx="150" cy="384" r="60" fill="none" stroke="#E8618C" stroke-width="26" stroke-dasharray="115.57 261.42" stroke-dashoffset="-129.02" transform="rotate(-90 150 384)"/>
<circle cx="150" cy="384" r="60" fill="none" stroke="#5BAA3C" stroke-width="26" stroke-dasharray="98.57 278.42" stroke-dashoffset="-246.60" transform="rotate(-90 150 384)"/>
<circle cx="150" cy="384" r="60" fill="none" stroke="#3F8FD2" stroke-width="26" stroke-dasharray="20.11 356.88" stroke-dashoffset="-347.17" transform="rotate(-90 150 384)"/>
<circle cx="150" cy="384" r="60" fill="none" stroke="#E2A400" stroke-width="26" stroke-dasharray="5.71 371.28" stroke-dashoffset="-369.28" transform="rotate(-90 150 384)"/>
    <text x="150" y="389" class="l" fill="var(--sub)">языки</text>
    <circle cx="262" cy="331" r="6" fill="#7F67BE"/><text x="278" y="336" class="lg">Slint · 34%</text>
<circle cx="262" cy="359" r="6" fill="#E8618C"/><text x="278" y="364" class="lg">Rust · 31%</text>
<circle cx="262" cy="387" r="6" fill="#5BAA3C"/><text x="278" y="392" class="lg">Zig · 27%</text>
<circle cx="262" cy="415" r="6" fill="#3F8FD2"/><text x="278" y="420" class="lg">Svelte · 6%</text>
<circle cx="262" cy="443" r="6" fill="#E2A400"/><text x="278" y="448" class="lg">Python · 2%</text>
    <rect x="540" y="330" width="244" height="44" rx="22" fill="var(--a)"/>
    <text x="562" y="358" class="ct" fill="var(--ao)">Telegram · t.me/pkowwww</text>
    <rect x="540" y="388" width="244" height="44" rx="22" fill="var(--b)"/>
    <text x="562" y="416" class="ct" fill="var(--bo)">Сайт · pivozavr7.github.io</text>
  </g>
</svg>
