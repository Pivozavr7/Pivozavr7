<svg xmlns="http://www.w3.org/2000/svg" width="640" height="30" viewBox="0 0 640 30" role="img" aria-label="Проекты"><title>Проекты</title><style>text{font-family:Roboto,'Google Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.hl{font-size:32px;font-weight:500;fill:#e0e4dd}.bl{font-size:16px;fill:#c1c9bf;letter-spacing:.5px}.tm{font-size:16px;font-weight:500;fill:#e0e4dd;letter-spacing:.15px}.tl{font-size:14px;font-weight:500;fill:#c1c9bf;letter-spacing:.1px}.bm{font-size:14px;fill:#c1c9bf;letter-spacing:.25px}.lm{font-size:12px;font-weight:500;fill:#c1c9bf;letter-spacing:.5px}.ll{font-size:14px;font-weight:500;letter-spacing:.1px}.v{font-size:22px;font-weight:500;fill:#b6f1b8}@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.18)}20%{transform:scale(1)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}@keyframes draw{0%,6%{stroke-dashoffset:22}24%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:22}}@keyframes ring{0%{opacity:.6;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.5)}}@keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop 5s cubic-bezier(.2,0,0,1) infinite backwards}.tick{stroke-dasharray:22;animation:draw 5s ease-out infinite backwards}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.5s ease-out infinite}.live{transform-box:fill-box;transform-origin:center;animation:live 1.8s ease-in-out infinite}.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}@media (prefers-reduced-motion:reduce){.pop,.tick,.ring,.live{animation:none}}</style><text class="tl" x="4" y="21">Проекты</text></svg>
