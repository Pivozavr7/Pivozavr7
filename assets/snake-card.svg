<svg xmlns="http://www.w3.org/2000/svg" width="640" height="72" viewBox="0 0 640 72" role="img" aria-label="Коммиты за год: змейка доедает мой вклад"><title>Коммиты за год: змейка доедает мой вклад</title><style>text{font-family:Roboto,'Google Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.hl{font-size:32px;font-weight:500;fill:#e0e4dd}.bl{font-size:16px;fill:#c1c9bf;letter-spacing:.5px}.tm{font-size:16px;font-weight:500;fill:#e0e4dd;letter-spacing:.15px}.tl{font-size:14px;font-weight:500;fill:#c1c9bf;letter-spacing:.1px}.bm{font-size:14px;fill:#c1c9bf;letter-spacing:.25px}.lm{font-size:12px;font-weight:500;fill:#c1c9bf;letter-spacing:.5px}.ll{font-size:14px;font-weight:500;letter-spacing:.1px}.v{font-size:22px;font-weight:500;fill:#b6f1b8}@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.18)}20%{transform:scale(1)}88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}@keyframes draw{0%,6%{stroke-dashoffset:22}24%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:22}}@keyframes ring{0%{opacity:.6;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.5)}}@keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop 5s cubic-bezier(.2,0,0,1) infinite backwards}.tick{stroke-dasharray:22;animation:draw 5s ease-out infinite backwards}.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.5s ease-out infinite}.live{transform-box:fill-box;transform-origin:center;animation:live 1.8s ease-in-out infinite}.d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}@media (prefers-reduced-motion:reduce){.pop,.tick,.ring,.live{animation:none}}</style><rect x="0" y="0" width="640" height="72" rx="16" fill="#1b201b"/><circle cx="36" cy="36" r="20" fill="#245031"/><g transform="translate(26 26) scale(0.833)" fill="none" stroke="#c9f5cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g><text class="tm" x="72" y="34">Коммиты за год</text><text class="bm" x="72" y="54">Змейка доедает мой вклад</text><rect x="406" y="20" width="218" height="32" rx="16" fill="#3b4b3d"/><circle class="live" cx="424" cy="36" r="4" fill="#b6f1b8"/><text class="ll" x="434" y="41" fill="#d2e8d3">обновляется каждые 12 ч</text></svg>
