name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/build.py", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать карточки и README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python scripts/build.py
      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "обновил профиль" && git push)
