<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">не вайбкод, всё сам</title>
  <style>
    :root{--bg:#F3EDF7;--text:#1D1B20;--accent:#6750A4;--chip:#B7F397;--check:#0C2000}
    @media (prefers-color-scheme:dark){:root{--bg:#211F26;--text:#E6E0E9;--accent:#D0BCFF;--chip:#2D5016;--check:#B7F397}}
    .bg{fill:var(--bg)}
    .txt{font:500 80px Roboto,'Google Sans','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:var(--text);animation:in .8s ease-out both}
    .acc{fill:var(--accent)}
    .chip{fill:var(--chip);transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,0,0,1.4) both}
    .tick{stroke:var(--check);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>

  <rect class="bg" width="1200" height="260" rx="28"/>

  <text class="txt" x="64" y="156" textLength="830" lengthAdjust="spacingAndGlyphs">не вайбкод, <tspan class="acc">всё сам</tspan></text>

  <g>
    <circle class="chip" cx="962" cy="130" r="32" style="animation-delay:.6s"/>
    <path class="tick" pathLength="1" d="M949 131l9 9 17-19" style="animation-delay:.9s"/>
    <circle class="chip" cx="1038" cy="130" r="32" style="animation-delay:.8s"/>
    <path class="tick" pathLength="1" d="M1025 131l9 9 17-19" style="animation-delay:1.1s"/>
    <circle class="chip" cx="1114" cy="130" r="32" style="animation-delay:1s"/>
    <path class="tick" pathLength="1" d="M1101 131l9 9 17-19" style="animation-delay:1.3s"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
